spring:
  application:
    name: limit-service
  datasource:
    url: jdbc:postgresql://localhost:5435/limitsapp
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    contexts: dev
    drop-first: false

server:
  servlet:
    context-path: "/limit-app"
  port: 8984

limits:
  default-limit: 100000.0
  default-reserve-limit: 0.0