databaseChangeLog:
  - changeSet:
      id: 001-initial-schema
      author: dev
      changes:
        - createTable:
            tableName: user_limit
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: current_limit
                  type: DECIMAL(15,2)
                  defaultValue: 100000.00
              - column:
                  name: reserved
                  type: DECIMAL(15,2)
                  defaultValue: 0.00
